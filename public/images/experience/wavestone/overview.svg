<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">Wavestone — 3,000+ TB of SharePoint cleaned for 6,000 users, RTE dashboards, an IoT proof of concept</title>
<desc id="d">Technical Product Manager at Wavestone, three projects. First, a Python interface run locally that cleans SharePoint across more than 3,000 TB for more than 6,000 users, cutting manual cleanup time by 90%. Second, for RTE's S3REnR programme, one Excel and Power BI dashboard per region that gives every grid investment a capacity in megawatts without a network study; in Pays de la Loire zone 3, a reserved 220 MW minus 30, 38, 43 and 47 MW already accounted for leaves 62 MW, about 15 MW for each of 4 reinforcements. Third, an IoT proof of concept on LoRaWAN with ChirpStack, ThingsBoard and PostgreSQL in Docker, sized for Azure Kubernetes at 3 vCPU and 5 GB of RAM for 10 sensors sending one message every 30 minutes, about 1.5 GB of data a year.</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#7A766E"/></marker>
</defs>
<rect width="1200" height="620" fill="#F5F3EE"/>

<!-- headline -->
<text x="56" y="64" font-size="14" letter-spacing=".2em" fill="#7A766E">WAVESTONE · TECHNICAL PRODUCT MANAGER</text>
<text x="56" y="114" font-size="40" font-weight="700" fill="#141414">3,000+ TB cleaned for 6,000 users.</text>
<text x="56" y="154" font-size="19" fill="#4A4740">A Python interface for SharePoint cleanup, then two more: dashboards that</text>
<text x="56" y="180" font-size="19" fill="#4A4740">size every RTE grid project in MW, and an IoT proof of concept sized for AKS.</text>

