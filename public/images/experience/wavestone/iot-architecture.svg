<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">IoT proof of concept — architecture of the local Docker environment</title>
<desc id="d">A local Docker environment with two stacks. The ChirpStack stack holds ChirpStack, the LoRaWAN network server, on port 8082; the Mosquitto MQTT broker on port 1884, linked to ChirpStack over MQTT; Redis on port 6379; the gateway bridge on UDP port 1700; the ChirpStack REST API on port 8090; and PostgreSQL on port 5432. It sends data over HTTP to the ThingsBoard stack on port 8080. The ThingsBoard stack runs ThingsBoard Community Edition with its web UI on port 8080, MQTT on port 1883, its REST API on port 8080, and an embedded PostgreSQL.</desc>
<defs>
  <marker id="go" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2A78D6"/></marker>
</defs>
<rect width="1200" height="620" fill="#F5F3EE"/>

<!-- headline -->
<text x="40" y="56" font-size="14" letter-spacing=".2em" fill="#7A766E">IoT PROOF OF CONCEPT · LOCAL DOCKER ENVIRONMENT</text>
<text x="40" y="100" font-size="30" font-weight="700" fill="#141414">Two stacks, one HTTP link.</text>
<text x="40" y="132" font-size="16" fill="#4A4740">ChirpStack runs the LoRaWAN network; ThingsBoard stores and shows the data.</text>

