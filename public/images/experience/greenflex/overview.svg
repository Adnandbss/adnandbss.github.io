<text x="56" y="64" font-size="14" letter-spacing=".2em" fill="#7A766E">GREENFLEX · ENERGY DASHBOARD · ISO 50001</text>
<text x="56" y="114" font-size="40" font-weight="700" fill="#141414">Built as an intern. Sold on every mission.</text>
<text x="56" y="154" font-size="19" fill="#4A4740">Power BI + VBA, gas and electricity. First sold on a pharmaceutical mission,</text>
<text x="56" y="180" font-size="19" fill="#4A4740">it has been a paid deliverable on every ISO 50001 engagement since.</text>

