<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">Light-aircraft brake — the heat of one stop sets the disc thickness</title>
<desc id="d">A 685 kg light aircraft stops from 53 m/s at 4 m/s² in 13.25 s over 351 m while both engines still push 200 N each. The brakes absorb 962 kJ of kinetic energy plus about 140 kJ from the engines, 1.10 MJ in all. Two stainless discs heated from 20 to 450 °C need 5.74 kg of steel, so each disc, 125 mm outside and 64 mm inside, is about 40 mm thick. A floating caliper with one 56 mm piston loads one pad, and the sliding body puts the same force on the other. Braking torque is 204 N·m per wheel; six M5 bolts hold the wheel where four would pass the separation check.</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#7A766E"/></marker>
  <marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#141414"/></marker>
</defs>
<rect width="1200" height="620" fill="#F5F3EE"/>

<!-- headline -->
<text x="56" y="64" font-size="14" letter-spacing=".2em" fill="#7A766E">LIGHT-AIRCRAFT BRAKE · FLOATING CALIPER</text>
<text x="56" y="116" font-size="44" font-weight="700" fill="#141414">One stop's heat sets the disc.</text>
<text x="56" y="154" font-size="19" fill="#4A4740">685 kg from 53 m/s at 4 m/s²: 13.25 s and 351 m, engines still pushing.</text>
<text x="56" y="180" font-size="19" fill="#4A4740">The rim caps the disc at 125 mm; the steel must stay under 450 °C.</text>

<!-- left: energy of one stop, then what it demands -->
<text x="56" y="236" font-size="13" letter-spacing=".2em" fill="#7A766E">ENERGY OF ONE STOP</text>
<rect x="120" y="268" width="449" height="24" fill="#2A78D6"/>
<path d="M571 268 H630.5 Q634.5 268 634.5 272 V288 Q634.5 292 630.5 292 H571 Z" fill="#EB6834"/>
<text x="646" y="286" font-size="17" font-weight="700" fill="#141414">1.10 MJ</text>
<text x="120" y="316" font-size="15" fill="#141414">kinetic 962 kJ</text>
<text x="634.5" y="316" font-size="15" fill="#141414" text-anchor="end">engines 140 kJ</text>

<text x="120" y="398" font-size="34" font-weight="700" fill="#141414">1.10 MJ</text>
<text x="120" y="422" font-size="14" fill="#4A4740">to absorb in one stop</text>
<line x1="304" y1="388" x2="330" y2="388" stroke="#7A766E" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="340" y="398" font-size="34" font-weight="700" fill="#141414">5.74 kg</text>
<text x="340" y="422" font-size="14" fill="#4A4740">of steel, 20 → 450 °C</text>
<line x1="522" y1="388" x2="548" y2="388" stroke="#7A766E" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="558" y="398" font-size="34" font-weight="700" fill="#141414">40 mm</text>
<text x="558" y="422" font-size="14" fill="#4A4740">per disc, Ø 125/64 mm</text>
<text x="120" y="470" font-size="13" fill="#7A766E">m = E / (c·ΔT), stainless c = 447 J/(kg·K), split over two discs.</text>
<text x="120" y="494" font-size="13" fill="#7A766E">Thickness comes from heat, not from stiffness.</text>
<line x1="740" y1="226" x2="740" y2="556" stroke="#E1E0D9" stroke-width="1"/>

<!-- right: floating caliper in section -->
<text x="770" y="236" font-size="13" letter-spacing=".2em" fill="#7A766E">FLOATING CALIPER</text>
<g transform="translate(770 256)">
  <line x1="70" y1="15" x2="290" y2="15" stroke="#141414" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="170" y="26" width="18" height="174" fill="#B9B7AE" stroke="#141414" stroke-width="1"/>
  <path d="M110 8 H250 V96 H206 V22 H152 V96 H110 Z" fill="#FFFFFF" stroke="#141414" stroke-width="1.5"/>
  <rect x="128" y="40" width="26" height="44" fill="#F5F3EE" stroke="#141414" stroke-width="1"/>
  <rect x="156" y="36" width="12" height="52" fill="#141414"/>
  <rect x="190" y="36" width="12" height="52" fill="#141414"/>
  <g stroke="#141414" stroke-width="1.5" marker-end="url(#fk)"><line x1="116" y1="114" x2="148" y2="114"/><line x1="244" y1="114" x2="212" y2="114"/></g>
  <g font-size="13" fill="#4A4740">
    <text x="160" y="140" text-anchor="end">piston Ø 56 mm</text>
    <text x="198" y="140">body slides back</text>
    <text x="294" y="20">slide pin</text>
    <text x="258" y="60">pads</text>
    <text x="258" y="78">110° of disc</text>
    <text x="198" y="190">disc, steel</text>
  </g>
</g>
<text x="770" y="486" font-size="15" fill="#4A4740">braking torque</text>
<text x="770" y="526" font-size="34" font-weight="700" fill="#141414">204 N·m</text>
<text x="770" y="550" font-size="13" fill="#7A766E">per wheel</text>
<text x="990" y="486" font-size="15" fill="#4A4740">wheel bolts</text>
<text x="990" y="526" font-size="34" font-weight="700" fill="#141414">6 × M5</text>
<text x="990" y="550" font-size="13" fill="#7A766E">where 4 would pass</text>
</svg>
