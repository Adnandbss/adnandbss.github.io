<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">Shrouded wind turbine — built for a tip-speed ratio of 1, peaks near 2</title>
<desc id="d">Measured power coefficient against tip-speed ratio for a seven-blade rotor in a NACA diffuser, 3D-printed and tested in the LIFSE wind tunnel. At 10 m/s the coefficient peaks at 0.55 at a tip-speed ratio of 1.94; at the ratio of 1 set in the brief it is about 0.43. At 13 m/s it peaks at 0.50. Peak torque is 16 mN·m at 10 m/s and 25 mN·m at 13 m/s. The generator was calibrated on a bench at 0.05 N·m per ampere. Group project with Mehdi Chtourou, Clara Giordano, Yannis Yessis and Zhengxuan Zhang.</desc>
<defs>
  <marker id="sm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#7A766E"/></marker>
</defs>
<rect width="1200" height="620" fill="#F5F3EE"/>

<!-- headline -->
<text x="56" y="64" font-size="14" letter-spacing=".2em" fill="#7A766E">SHROUDED WIND TURBINE · LIFSE WIND TUNNEL</text>
<text x="56" y="116" font-size="44" font-weight="700" fill="#141414">Built for λ = 1. Peaks at λ ≈ 2.</text>
<text x="56" y="154" font-size="19" fill="#4A4740">Seven blades in a NACA diffuser, 3D-printed, measured at 10 and 13 m/s.</text>
<text x="56" y="180" font-size="19" fill="#4A4740">Group project with M. Chtourou, C. Giordano, Y. Yessis, Z. Zhang.</text>

