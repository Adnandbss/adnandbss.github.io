<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">Battery cooling — the fluid decides more than the flow</title>
<desc id="d">Conjugate heat transfer in a liquid-cooled LiFePO4 pack simulated in Star-CCM+, changing one thing at a time from an SF10 baseline. Raising the flow from 0.8 to 1.2 kg/s drops the peak temperature from 71 to 58 °C, but a realistic pump holds about 0.8 kg/s. Opening the gap between cells from 2 to 4 mm cools better than 2 mm; opening the gap around the pack from 5 to 10 mm cools the pack, with up to 8 °C between centre and edge. With water–glycol (thermal conductivity 0.37 W/(m·K)) the cells level off near 42 °C; with Novec 7200 (0.065 W/(m·K)) they pass 70 °C and keep rising. Group project with Sébastien Callegari.</desc>
<defs>
  <radialGradient id="core" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#EB6834" stop-opacity=".75"/>
    <stop offset="1" stop-color="#EB6834" stop-opacity=".12"/>
  </radialGradient>
</defs>
<rect width="1200" height="620" fill="#F5F3EE"/>

<!-- headline -->
<text x="56" y="64" font-size="14" letter-spacing=".2em" fill="#7A766E">BATTERY COOLING · STAR-CCM+ · LiFePO4 PACK</text>
<text x="56" y="116" font-size="44" font-weight="700" fill="#141414">The fluid decides more than the flow.</text>
<text x="56" y="154" font-size="19" fill="#4A4740">Conjugate heat transfer in a liquid-cooled pack, one change at a time.</text>
<text x="56" y="180" font-size="19" fill="#4A4740">Group project with Sébastien Callegari. Baseline coolant: SF10.</text>

<!-- left: the pack in section -->
<text x="56" y="236" font-size="13" letter-spacing=".2em" fill="#7A766E">THE PACK, IN SECTION</text>
<g transform="translate(56 262)">
  <rect x="20" y="20" width="360" height="200" fill="#2A78D6" fill-opacity=".12" stroke="#141414" stroke-width="1.5"/>
  <g fill="url(#core)" stroke="#141414" stroke-width="1">
    <rect x="44" y="44" width="90" height="152"/>
    <rect x="155" y="44" width="90" height="152"/>
    <rect x="266" y="44" width="90" height="152"/>
  </g>
  <g font-size="13" fill="#141414" text-anchor="middle">
    <text x="89" y="124">cell</text><text x="200" y="124">cell</text><text x="311" y="124">cell</text>
  </g>
  <line x1="144.5" y1="12" x2="144.5" y2="62" stroke="#141414" stroke-width="1"/>
  <text x="152" y="10" font-size="14" fill="#141414">gap between cells</text>
  <line x1="32" y1="232" x2="32" y2="184" stroke="#141414" stroke-width="1"/>
  <text x="40" y="244" font-size="14" fill="#141414">gap around the pack</text>
  <text x="372" y="213" font-size="13" fill="#4A4740" text-anchor="end">coolant</text>
</g>
<line x1="476" y1="226" x2="476" y2="556" stroke="#E1E0D9" stroke-width="1"/>

<!-- right: the three levers -->
<text x="500" y="236" font-size="13" letter-spacing=".2em" fill="#7A766E">FLOW</text>
<text x="500" y="266" font-size="17" fill="#141414">0.8 → 1.2 kg/s</text>
<text x="500" y="290" font-size="14" fill="#7A766E">a real pump holds ≈ 0.8</text>
<text x="830" y="276" font-size="34" font-weight="700" fill="#141414">71 → 58 °C</text>
<text x="830" y="298" font-size="13" fill="#7A766E">peak temperature</text>

<line x1="500" y1="318" x2="1144" y2="318" stroke="#E1E0D9" stroke-width="1"/>
<text x="500" y="346" font-size="13" letter-spacing=".2em" fill="#7A766E">GAPS</text>
<text x="500" y="376" font-size="17" fill="#141414">between cells 2 → 4 mm</text>
<text x="500" y="402" font-size="17" fill="#141414">around pack 5 → 10 mm</text>
<text x="830" y="376" font-size="17" fill="#141414">4 mm cools better</text>
<text x="830" y="402" font-size="17" fill="#141414">cooler; centre–edge ≤ 8 °C</text>

<line x1="500" y1="424" x2="1144" y2="424" stroke="#E1E0D9" stroke-width="1"/>
<text x="500" y="452" font-size="13" letter-spacing=".2em" fill="#7A766E">FLUID · THE BIGGEST LEVER</text>
<text x="500" y="486" font-size="17" fill="#141414">water–glycol</text>
<path d="M640 473 H780 Q784 473 784 477 V483 Q784 487 780 487 H640 Z" fill="#2A78D6"/>
<text x="792" y="485" font-size="13" fill="#4A4740">0.37</text>
<text x="860" y="486" font-size="17" font-weight="700" fill="#141414">cells level off ≈ 42 °C</text>
<text x="500" y="518" font-size="17" fill="#141414">Novec 7200</text>
<path d="M640 505 H662 Q666 505 666 509 V515 Q666 519 662 519 H640 Z" fill="#2A78D6"/>
<text x="674" y="517" font-size="13" fill="#4A4740">0.065</text>
<text x="860" y="518" font-size="17" font-weight="700" fill="#141414">cells pass 70 °C, rising</text>
<text x="500" y="546" font-size="13" fill="#7A766E">bars: thermal conductivity, W/(m·K)</text>
</svg>
