<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">Solar turbine fuel setting — outside the tests, Send stays off</title>
<desc id="d">A hybrid solar gas turbine holds its turbine inlet at 1473 K by adjusting the fuel. A 4-8-4-2 network predicts the air-fuel ratio from inlet air temperature, propane fraction and solar heat. The 60 training runs cover inlet air from 268 to 318 K and solar heat from 500 to 2500 kW, at propane fractions of 0, 0.25 and 0.5. The console's Send button works only inside that range, except at the hot corner (318 K, propane 0.5, 2500 kW), where the measured air-fuel ratio is 131.3 and the model says 116.1. On 20 test runs the rms error is 0.0022 in efficiency and 4.02 in air-fuel ratio, mostly from that corner.</desc>
<defs>
  <marker id="sm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#141414"/></marker>
</defs>
<rect width="1200" height="620" fill="#F5F3EE"/>

<!-- headline -->
<text x="56" y="64" font-size="14" letter-spacing=".2em" fill="#7A766E">SOLAR-HYBRID GAS TURBINE · FUEL SETTING</text>
<text x="56" y="116" font-size="44" font-weight="700" fill="#141414">Outside the tests, Send stays off.</text>
<text x="56" y="154" font-size="19" fill="#4A4740">A 4-8-4-2 network predicts the fuel that holds the turbine at 1473 K.</text>
<text x="56" y="180" font-size="19" fill="#4A4740">The console only sends a setting the 60 tests actually cover.</text>

