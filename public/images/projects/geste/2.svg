<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Geste — a lab's agent buys data inside its budget</title>
<desc id="d">Each trade has a live price driven by supply, demand and a web signal. The lab's AI agent requests clips, receives HTTP 402 Payment Required, pays in AUSD with x402 on Base without gas, under a budget it cannot exceed, and receives the clips with their signed manifest. 70% of every sale goes to the artisan.</desc>
<defs>
  <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#8B8CF8"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#F2B866"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#5FD3A0"/></marker>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
    .panel{fill:#121933;stroke:#232C52;stroke-width:1.2}
    .lbl{font-size:11.5px;fill:#8B8CF8;letter-spacing:.2em}
  </style>
</defs>
<rect width="1200" height="620" fill="#0B1020"/>
<text x="60" y="68" class="mono" font-size="12" fill="#8B8CF8" letter-spacing=".22em">GESTE · FOR ROBOTICS LABS</text>
<text x="60" y="112" font-size="34" font-weight="700" fill="#F1F2FA" letter-spacing="-.02em">An agent buys data, <tspan fill="#8B8CF8">inside its budget.</tspan></text>

<!-- Pricing -->
<rect class="panel" x="60" y="156" width="300" height="400" rx="16"/>
<text x="86" y="192" class="mono lbl">LIVE PRICE PER TRADE</text>
<g font-size="14" fill="#C9CCE6">
  <rect x="86" y="214" width="76" height="30" rx="15" fill="#1B2346" stroke="#2C3666"/><text x="104" y="234">supply</text>
  <rect x="172" y="214" width="84" height="30" rx="15" fill="#1B2346" stroke="#2C3666"/><text x="188" y="234">demand</text>
  <rect x="86" y="254" width="110" height="30" rx="15" fill="#1B2346" stroke="#2C3666"/><text x="104" y="274">web signal</text>
</g>
<path d="M240 270 L240 300 Q240 310 230 310 L220 310 Q210 310 210 320 L210 338" stroke="#8B8CF8" stroke-width="1.6" fill="none" marker-end="url(#av)"/>
<text x="252" y="296" class="mono" font-size="10.5" fill="#6C7299">price</text>
<g font-size="16" fill="#F1F2FA">
  <rect x="86" y="348" width="248" height="56" rx="12" fill="#161E3D" stroke="#2C3666"/>
  <text x="106" y="382" font-weight="600">Pastry</text>
  <rect x="86" y="414" width="248" height="56" rx="12" fill="#161E3D" stroke="#2C3666"/>
  <text x="106" y="448" font-weight="600">Butchery</text>
  <rect x="86" y="480" width="248" height="56" rx="12" fill="#161E3D" stroke="#2C3666" stroke-dasharray="4 4"/>
  <text x="106" y="514" fill="#6C7299">… any trade</text>
</g>
<g class="mono" font-size="11" fill="#5FD3A0">
  <circle cx="270" cy="377" r="3.5" fill="#5FD3A0"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="280" y="381">live</text>
  <circle cx="270" cy="443" r="3.5" fill="#5FD3A0"><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></circle><text x="280" y="447">live</text>
</g>

<!-- Sequence -->
<rect class="panel" x="384" y="156" width="480" height="400" rx="16"/>
<text x="410" y="192" class="mono lbl">HTTP 402 · x402 ON BASE</text>
<g font-size="14" font-weight="600" fill="#F1F2FA" text-anchor="middle">
  <rect x="420" y="210" width="140" height="40" rx="10" fill="#1F2858" stroke="#8B8CF8"/><text x="490" y="235">Lab AI agent</text>
  <rect x="688" y="210" width="140" height="40" rx="10" fill="#1B2346" stroke="#2C3666"/><text x="758" y="235">Geste</text>
</g>
<g stroke="#2C3666" stroke-width="1.4" stroke-dasharray="4 5"><line x1="490" y1="250" x2="490" y2="536"/><line x1="758" y1="250" x2="758" y2="536"/></g>
<g stroke-width="1.8">
  <line x1="494" y1="294" x2="752" y2="294" stroke="#8B8CF8" marker-end="url(#av)"/>
  <line x1="754" y1="354" x2="496" y2="354" stroke="#F2B866" marker-end="url(#aa)"/>
  <line x1="494" y1="414" x2="752" y2="414" stroke="#8B8CF8" marker-end="url(#av)"/>
  <line x1="754" y1="490" x2="496" y2="490" stroke="#5FD3A0" marker-end="url(#ag)"/>
</g>
<g font-size="13.5" text-anchor="middle">
  <text x="624" y="284" fill="#C9CCE6">request clips</text>
  <text x="624" y="344" class="mono" font-size="13" fill="#F2B866">402 Payment Required</text>
  <text x="624" y="404" fill="#C9CCE6">pay in <tspan font-weight="700" fill="#F1F2FA">AUSD</tspan> · gasless</text>
  <text x="624" y="480" fill="#C9CCE6">clips + signed manifest</text>
  <text x="624" y="508" class="mono" font-size="11" fill="#5FD3A0">200 OK</text>
</g>
<circle r="5" fill="#8B8CF8"><animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;1;1;1" keyTimes="0;.22;.5;.75;1" calcMode="linear" path="M494 294 L752 294"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.22;.23;1" dur="5s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#5FD3A0"><animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.6;.85;1" calcMode="linear" path="M754 490 L496 490"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.59;.6;.85;.86" dur="5s" repeatCount="indefinite"/></circle>
<!-- budget -->
<rect x="410" y="296" width="14" height="210" rx="7" fill="#1B2346" stroke="#2C3666"/>
<rect x="412" y="380" width="10" height="124" rx="5" fill="#8B8CF8" opacity=".85"/>
<line x1="404" y1="296" x2="430" y2="296" stroke="#F26B6B" stroke-width="2"/>
<text x="404" y="546" class="mono" font-size="10.5" fill="#F26B6B">hard budget</text>

<!-- Settlement -->
<rect class="panel" x="888" y="156" width="252" height="400" rx="16"/>
<text x="914" y="192" class="mono lbl">SETTLEMENT</text>
<text x="914" y="300" font-size="80" font-weight="800" fill="#5FD3A0" letter-spacing="-.04em">70%</text>
<text x="914" y="336" font-size="16" fill="#F1F2FA">of every sale goes</text>
<text x="914" y="358" font-size="16" fill="#F1F2FA">to the artisan.</text>
<line x1="914" y1="396" x2="1114" y2="396" stroke="#232C52"/>
<g font-size="13" fill="#9AA0C4">
  <text x="914" y="428">Provenance and consent</text>
  <text x="914" y="448">travel with every clip:</text>
  <text x="914" y="468">the manifest is signed by</text>
  <text x="914" y="488">the artisan (EIP-712).</text>
</g>
</svg>
